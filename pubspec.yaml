name: ninja_store
description: "A new Flutter project."


publish_to: 'none' 





version: 1.0.0+1

environment:
  sdk: ^3.7.0







dependencies:
  flutter:
    sdk: flutter 
  cupertino_icons: ^1.0.8
  iconsax: ^0.0.8
  http: ^1.3.0
  intl: ^0.17.0
  logger: ^2.5.0
  url_launcher: ^6.0.9
  flutter_native_splash: ^2.4.5
  smooth_page_indicator: ^1.2.0+3
  carousel_slider: ^5.0.0


  #STATE MANAGEMENT
  get: ^4.3.8
  get_storage: ^2.1.1

  #Product Specific
  readmore: ^3.0.0
  lottie: ^3.3.1
  connectivity_plus: ^6.1.4
  flutter_rating_bar: ^4.0.1
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.7
  google_sign_in: ^6.3.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  
  flutter_lints: ^5.0.0
  
  





flutter:

  
  
  
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/banners/
    - assets/images/products/

    - assets/images/on_boarding_screen/
    - assets/images/payment_methods/
    - assets/icons/
    - assets/icons/categories/
    - assets/images/users/
    - assets/animation/

    - assets/logos/


  fonts:
    - family: Adobe 
      fonts:
        - asset: assets/fonts/AdobeArabic-Bold.otf
        - asset: assets/fonts/AdobeArabic-BoldItalic.otf
        - asset: assets/fonts/AdobeArabic-Italic.otf
          weight: 500
        - asset: assets/fonts/AdobeArabic-Regular.otf
        - asset: assets/fonts/arial.ttf
        - asset: assets/fonts/arial.ttf
          weight: 500
        - asset: assets/fonts/arialbi.ttf
        - asset: assets/fonts/ariali.ttf
        - asset: assets/fonts/ARIALN.ttf
          style: italic

        - asset: assets/fonts/ARIALNB.ttf
        - asset: assets/fonts/ARIALNBI.ttf
        - asset: assets/fonts/ARIALNI.ttf
        - asset: assets/fonts/ARIALUNI.ttf
        - asset: assets/fonts/ariblk.ttf
        - asset: assets/fonts/ARLRDBD.TTF
        - asset: assets/fonts/PTBLDDSK.TTF
        - asset: assets/fonts/STENCIL.TTF
        - asset: assets/fonts/StencilStd.otf
    - family: MAJALLAB
      fonts:
        - asset: assets/fonts/majalla.ttf
 
  
  
  
  

  
  

  
  

  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
